name: CI and Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned runtime
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --requirement requirements.txt

      - name: Verify Python runtime and behavior
        shell: pwsh
        run: |
          $site = python -c "import pathlib, whisper_dictation; print(pathlib.Path(whisper_dictation.__file__).parent)"
          ./scripts/apply_patches.ps1 -Site $site -RunnerTarget (Join-Path $env:RUNNER_TEMP "run_daemon.pyw")
          python -m compileall -q run_daemon.pyw scripts
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify clean and upgrade patch migrations
        shell: pwsh
        run: ./tests/test_patch_migrations.ps1 -Python (Get-Command python).Source

      - name: Verify configuration and layout
        shell: pwsh
        run: |
          dotnet run --project ui/ConfigManager.Tests -c Release
          dotnet run --project ui/LayoutCheck -c Release
          ./tests/test_shortcut_manager.ps1
          ./tests/test_installer_runtime_stop.ps1

      - name: Verify release package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw ui/VoicePromptTray/VoicePromptTray.csproj)).Project.PropertyGroup.Version
          ./scripts/package_release.ps1 -Version $version

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build release package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          ./scripts/package_release.ps1 -Version $version

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: VoicePrompt ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/VoicePrompt-${{ github.ref_name }}-windows-x64.zip
            dist/VoicePromptTray.exe
            dist/VoicePrompt-${{ github.ref_name }}-SHA256SUMS.txt
