name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare resilient site download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.21.0
          RELEASE_ZIP: VoicePrompt-v1.21.0-windows-x64.zip
          RELEASE_SUMS: VoicePrompt-v1.21.0-SHA256SUMS.txt
        run: |
          mkdir -p _site/downloads
          cp -R docs/. _site/
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$RELEASE_ZIP" \
            --pattern "$RELEASE_SUMS" \
            --dir _site/downloads
          expected="$(tr -d '\r' < "_site/downloads/$RELEASE_SUMS" | awk -v file="$RELEASE_ZIP" '$2 == file { print $1 }')"
          actual="$(sha256sum "_site/downloads/$RELEASE_ZIP" | awk '{ print $1 }')"
          test -n "$expected"
          test "$actual" = "$expected"
          echo "Verified $RELEASE_ZIP ($actual)"
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
