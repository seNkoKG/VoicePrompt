<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">VoicePrompt</title>
  <desc id="desc">Private voice typing for Windows with 100 supported languages. Speak naturally and type anywhere.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171b1f"/>
      <stop offset="1" stop-color="#0c0e10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(855 256) rotate(90) scale(290 350)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cddad1" stop-opacity=".13"/>
      <stop offset="1" stop-color="#cddad1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="520" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="518" rx="27" fill="none" stroke="#343b42"/>

  <g transform="translate(72 64)">
    <rect width="54" height="54" rx="16" fill="#23292e" stroke="#475149"/>
    <path d="M10 27h5l2-7 4 15 3-23 4 31 4-22 3 14 2-8h4" fill="none" stroke="#cddad1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="36" fill="#f3f5f1" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="-.6">VoicePrompt</text>
  </g>

  <text x="72" y="205" fill="#f3f5f1" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-3">Speak naturally.</text>
  <text x="72" y="269" fill="#bdc5be" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-3">Type anywhere.</text>
  <text x="74" y="321" fill="#8f9891" font-family="Segoe UI,Arial,sans-serif" font-size="17">Private, GPU-accelerated voice typing for Windows.</text>
  <g transform="translate(74 364)" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">
    <rect width="112" height="34" rx="17" fill="#222823" stroke="#475149"/><circle cx="17" cy="17" r="4" fill="#cddad1"/><text x="29" y="21" fill="#dbe0da">Local-first</text>
    <rect x="122" width="158" height="34" rx="17" fill="#191d20" stroke="#353d43"/><text x="155" y="21" fill="#b9c0ba">100 languages</text>
    <rect x="290" width="105" height="34" rx="17" fill="#191d20" stroke="#353d43"/><text x="309" y="21" fill="#b9c0ba">Open source</text>
  </g>

  <g transform="translate(660 72)" filter="url(#shadow)">
    <rect width="460" height="346" rx="20" fill="#111417" stroke="#3b444b"/>
    <path d="M0 48H460" stroke="#2b3238"/>
    <circle cx="24" cy="24" r="5" fill="#41494f"/><circle cx="41" cy="24" r="5" fill="#41494f"/><circle cx="58" cy="24" r="5" fill="#41494f"/>
    <rect x="22" y="72" width="102" height="250" rx="11" fill="#15191d"/>
    <rect x="37" y="94" width="54" height="6" rx="3" fill="#343c42"/>
    <rect x="32" y="128" width="82" height="31" rx="7" fill="#282e32"/>
    <circle cx="45" cy="143.5" r="4" fill="#cddad1"/><rect x="57" y="140" width="37" height="6" rx="3" fill="#d4dad4"/>
    <rect x="37" y="178" width="49" height="5" rx="2.5" fill="#505960"/><rect x="37" y="207" width="62" height="5" rx="2.5" fill="#505960"/><rect x="37" y="236" width="45" height="5" rx="2.5" fill="#505960"/>
    <text x="150" y="91" fill="#727d84" font-family="Segoe UI,Arial,sans-serif" font-size="9" letter-spacing="1.3">DICTATION</text>
    <text x="150" y="121" fill="#eff2ed" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Ready when you are</text>
    <rect x="150" y="148" width="280" height="105" rx="14" fill="#191e22" stroke="#313a40"/>
    <text x="170" y="174" fill="#88928c" font-family="Segoe UI,Arial,sans-serif" font-size="8" letter-spacing="1.2">HOLD TO SPEAK</text>
    <text x="170" y="211" fill="#f3f5f1" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">F1</text>
    <text x="170" y="231" fill="#707a73" font-family="Segoe UI,Arial,sans-serif" font-size="9">release to paste</text>
    <rect x="355" y="166" width="56" height="56" rx="13" fill="#252b26" stroke="#55604f" stroke-width="1.5"/>
    <text x="383" y="201" fill="#cddad1" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">F1</text>
    <rect x="150" y="268" width="280" height="54" rx="14" fill="#191e22" stroke="#313a40"/>
    <path d="M172 295h8l3-9 5 18 5-29 5 36 5-26 5 20 4-10h18" fill="none" stroke="#cddad1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="344" y="299" fill="#9da69f" font-family="Segoe UI,Arial,sans-serif" font-size="10">LISTENING</text>
  </g>
</svg>
